<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>for iris</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
/* Layout: a love-note card. A rotating 3D ASCII rose (pink, glowing on a dark terminal) sits beside
   iris's avatar as a colored ASCII portrait on a light "photo" tile. Soft day + berry-night page. */
:root{
  --bg1:#ffe4ef; --bg2:#ffd0e3; --bg3:#ffbfdc;
  --card:rgba(255,255,255,.64); --card-border:rgba(255,120,170,.34);
  --ink:#5a2742; --muted:#a8628a;
  --rose:#ff4f9a; --rose-deep:#d62d7e; --glow:rgba(255,95,160,.42);
  --screen:#140a1d; --screen-border:rgba(255,120,180,.4);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#190c1c; --bg2:#29122f; --bg3:#3a1640;
  --card:rgba(72,30,64,.48); --card-border:rgba(255,120,180,.30);
  --ink:#ffe2ef; --muted:#e0a9c9;
  --rose:#ff6fb0; --rose-deep:#ff3f92; --glow:rgba(255,110,180,.55);
  --screen:#120817; --screen-border:rgba(255,120,180,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg1:#190c1c; --bg2:#29122f; --bg3:#3a1640;
  --card:rgba(72,30,64,.48); --card-border:rgba(255,120,180,.30);
  --ink:#ffe2ef; --muted:#e0a9c9;
  --rose:#ff6fb0; --rose-deep:#ff3f92; --glow:rgba(255,110,180,.55);
  --screen:#120817; --screen-border:rgba(255,120,180,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0; min-height:100%; font-family:"Quicksand",system-ui,sans-serif; color:var(--ink);
  background:radial-gradient(135% 105% at 50% 0%,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed; overflow-x:hidden;}
#petals{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
.wrap{position:relative; z-index:1; max-width:600px; margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:clamp(26px,6vw,54px);
  display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center;}
.eyebrow{font-weight:600; letter-spacing:.2em; text-transform:uppercase; font-size:.72rem; color:var(--rose-deep); opacity:.9}
.card{width:100%; background:var(--card); border:1px solid var(--card-border); border-radius:30px;
  padding:clamp(18px,5vw,30px) clamp(14px,4vw,24px); backdrop-filter:blur(11px); -webkit-backdrop-filter:blur(11px);
  box-shadow:0 20px 54px -22px var(--glow), inset 0 1px 0 rgba(255,255,255,.4);
  display:flex; flex-direction:column; align-items:center; gap:14px;}
.title{font-family:"Baloo 2",system-ui,cursive; font-weight:700; font-size:clamp(2.4rem,11vw,3.6rem);
  line-height:.95; margin:0; color:var(--rose-deep); text-wrap:balance; text-shadow:0 2px 22px var(--glow);}
.title .heart{display:inline-block; color:var(--rose); animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.handle{font-weight:600; color:var(--muted); font-size:1rem; margin-top:-4px}
/* the duo: rose beside avatar, always side by side */
.duo{display:flex; flex-wrap:nowrap; gap:10px; width:100%; align-items:stretch; justify-content:center; margin-top:4px}
.panel{flex:1 1 0; min-width:0; display:flex; flex-direction:column; border-radius:16px; overflow:hidden;
  border:1px solid var(--screen-border); background:var(--screen); box-shadow:0 10px 30px -14px var(--glow);}
.panel.light{background:linear-gradient(180deg,#ffffff,#ffe6f2); border-color:rgba(255,120,170,.42);}
.bar{display:flex; align-items:center; gap:5px; padding:7px 9px; background:rgba(255,255,255,.05);
  border-bottom:1px solid rgba(255,255,255,.07);}
.panel.light .bar{background:rgba(255,120,175,.10); border-bottom-color:rgba(255,120,175,.22);}
.bar i{width:8px; height:8px; border-radius:50%; display:inline-block}
.bar .nm{margin-left:6px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.64rem;
  color:#f3c6dd; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.panel.light .bar .nm{color:#c23b7e}
.bloom-wrap{position:relative; width:100%; aspect-ratio:3/4}
canvas#rose{position:absolute; inset:0; width:100%; height:100%; display:block}
.ascii-fit{flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:5px; min-height:0}
.ascii{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace; white-space:pre;
  line-height:1; font-size:7px; letter-spacing:0; margin:0; display:inline-block; transform-origin:center; text-shadow:0 0 6px rgba(255,130,198,.55),0 0 2px rgba(255,170,215,.5);}
.cap{font-size:.84rem; color:var(--muted); line-height:1.45; max-width:40ch}
.note{font-size:1rem; line-height:1.5; max-width:34ch; margin:2px auto 0}
.note .pink{color:var(--rose-deep); font-weight:600}
.sig{font-family:"Baloo 2",system-ui,cursive; font-weight:600; color:var(--rose-deep); font-size:1.2rem}
.foot{font-size:.74rem; color:var(--muted); display:flex; gap:9px; align-items:center; flex-wrap:wrap; justify-content:center}
.foot .dot{opacity:.5}
@media (prefers-reduced-motion:reduce){ .title .heart{animation:none} }
</style>
</head>

<script>
(function(){
  "use strict";
  var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

  /* ---------- background drifting petals ---------- */
  (function(){
    var cv=document.getElementById("petals"),ctx=cv.getContext("2d");
    var W,H,DPR=Math.min(2,window.devicePixelRatio||1);
    function rs(){W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";}
    rs();addEventListener("resize",rs);
    var COL=["#ff9ec8","#ffc2dd","#ff7fb0","#ffd6e8"];
    function mk(){return{x:Math.random()*W,y:Math.random()*H,r:(4+Math.random()*7)*DPR,sp:(0.2+Math.random()*0.5)*DPR,sw:Math.random()*6,a:Math.random()*6.28,va:(Math.random()-0.5)*0.02,c:COL[(Math.random()*COL.length)|0],o:0.2+Math.random()*0.38};}
    function sh(r){ctx.beginPath();ctx.moveTo(0,-r);ctx.bezierCurveTo(r*0.9,-r*0.6,r*0.9,r*0.6,0,r);ctx.bezierCurveTo(-r*0.9,r*0.6,-r*0.9,-r*0.6,0,-r);ctx.closePath();}
    function dr(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=p.o;ctx.fillStyle=p.c;sh(p.r);ctx.fill();ctx.restore();}
    var ps;
    if(reduce){ps=Array.from({length:12},mk);ps.forEach(dr);}
    else{ps=Array.from({length:24},mk);(function f(){ctx.clearRect(0,0,W,H);for(var i=0;i<ps.length;i++){var p=ps[i];p.y+=p.sp;p.x+=Math.sin(p.y*0.01+p.sw)*0.4*DPR;p.a+=p.va;if(p.y-p.r>H){p.y=-p.r;p.x=Math.random()*W;}dr(p);}requestAnimationFrame(f);})();}
  })();

  /* ---------- 3D ASCII rose bouquet ---------- */
  var layerColors=[[255,200,224],[255,156,203],[255,111,176],[255,63,146],[214,45,126]];
  function rgb(c){return "rgb("+c[0]+","+c[1]+","+c[2]+")";}
  var RAMP=" .:-=+*#%@";

  function bloom(ox,oy,oz,sc,pts){
    var L=5, per=[7,6,6,5,4], i,k,u,w;
    for(i=0;i<L;i++){
      var f=i/(L-1), hl=oy+i*4*sc, tilt=(74-60*f)*Math.PI/180,
          plen=(24-12*f)*sc, pw=(9-4*f)*sc, col=layerColors[i], base=i*0.55, np=per[i];
      for(k=0;k<np;k++){
        var a=base+k*2*Math.PI/np;
        for(u=0.08;u<=1.001;u+=0.16){
          var hw=pw*Math.sin(Math.PI*Math.pow(u,0.7)),
              tu=tilt+u*0.5*(1-f), ax=u*plen*Math.sin(tu), ay=u*plen*Math.cos(tu);
          for(w=-1;w<=1.001;w+=0.66){
            var vp=w*hw;
            pts.push({x:ox+ax*Math.cos(a)+vp*(-Math.sin(a)),
                      y:hl+ay,
                      z:oz+ax*Math.sin(a)+vp*(Math.cos(a)), c:col});
          }
        }
      }
    }
    for(i=0;i<9;i++){var aa=i/9*6.283;pts.push({x:ox+Math.cos(aa)*1.4*sc,y:oy+L*4*sc,z:oz+Math.sin(aa)*1.4*sc,c:[180,36,107]});}
  }
  function bud(ox,oy,oz,sc,pts){
    var L=2, per=[5,4], i,k,u,w;
    for(i=0;i<L;i++){
      var f=i/1, hl=oy+i*3*sc, tilt=(66-46*f)*Math.PI/180, plen=(15-6*f)*sc, pw=(6-2*f)*sc, col=layerColors[i+2], np=per[i], base=i*0.6;
      for(k=0;k<np;k++){var a=base+k*2*Math.PI/np;
        for(u=0.1;u<=1.001;u+=0.22){var hw=pw*Math.sin(Math.PI*Math.pow(u,0.7)),tu=tilt+u*0.4,ax=u*plen*Math.sin(tu),ay=u*plen*Math.cos(tu);
          for(w=-1;w<=1.001;w+=1){var vp=w*hw;
            pts.push({x:ox+ax*Math.cos(a)+vp*(-Math.sin(a)),y:hl+ay,z:oz+ax*Math.sin(a)+vp*Math.cos(a),c:col});}}}
    }
  }
  function stem(bx,by,bz,pts){var ex=0,ey=-46,ez=0,n=24,i;for(i=0;i<=n;i++){var t=i/n;

  function leaf(cx,cy,cz,ang,pts){var u,w;for(u=0;u<=1.001;u+=0.16){var hw=5*Math.sin(Math.PI*u);
    for(w=-1;w<=1.001;w+=0.5){var lx=u*16,lz=w*hw;
      pts.push({x:cx+lx*Math.cos(ang)-lz*Math.sin(ang),y:cy-u*4,z:cz+lx*Math.sin(ang)+lz*Math.cos(ang),c:[90,196,118]});}}}

  var P=[];
  bloom(0,2,0,1.0,P);
  bud(-19,-8,5,0.62,P);
  bud(17,-5,-4,0.60,P);
  stem(0,2,0,P); stem(-19,-8,5,P); stem(17,-5,-4,P);
  leaf(-6,-24,0,2.5,P); leaf(7,-26,0,0.7,P);

  var minY=1e9,maxY=-1e9;
  P.forEach(function(p){if(p.y<minY)minY=p.y;if(p.y>maxY)maxY=p.y;});
  var yMid=(minY+maxY)/2;

  var cv=document.getElementById("rose"), ctx=cv.getContext("2d");
  var DPR=Math.min(2,window.devicePixelRatio||1), W=1,H=1,unit=4;
  function size(){var r=cv.getBoundingClientRect();W=cv.width=Math.max(1,Math.round(r.width*DPR));H=cv.height=Math.max(1,Math.round(r.height*DPR));
    unit=Math.min(W/96,H/104);}
  size(); addEventListener("resize",size);

  var screenBG=getComputedStyle(document.documentElement).getPropertyValue("--screen").trim()||"#140a1d";
  var ang=0, tiltX=0.42, cosT=Math.cos(tiltX), sinT=Math.sin(tiltX);
  function render(){
    ctx.globalCompositeOperation="source-over";
    ctx.fillStyle=screenBG; ctx.fillRect(0,0,W,H);
    var cosA=Math.cos(ang), sinA=Math.sin(ang), f=96, i, n=P.length;
    // compute projected
    var buf=[];
    for(i=0;i<n;i++){var p=P[i];
      var x1=p.x*cosA+p.z*sinA, z1=-p.x*sinA+p.z*cosA, y1=p.y-yMid;
      var y2=y1*cosT-z1*sinT, z2=y1*sinT+z1*cosT;
      var sc=f/(f+z2+40);
      buf.push({sx:W/2+x1*unit*sc, sy:H/2-y2*unit*sc, z:z2, c:p.c});
    }
    buf.sort(function(a,b){return a.z-b.z;});
    ctx.globalCompositeOperation="lighter";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    var fs=Math.max(6,unit*1.15*DPR/DPR); // in css-px already since ctx scaled? keep internal px
    fs=Math.max(7,unit*1.2);
    ctx.font=fs+"px ui-monospace, Menlo, monospace";
    for(i=0;i<buf.length;i++){var b=buf[i];
      var br=(b.z+42)/84; if(br<0)br=0; if(br>1)br=1; br=0.32+br*0.68;
      var ch=RAMP[Math.min(9,Math.max(0,Math.round(br*9)))];
      if(ch===" ")continue;
      ctx.fillStyle="rgb("+Math.round(b.c[0]*br)+","+Math.round(b.c[1]*br)+","+Math.round(b.c[2]*br)+")";
      ctx.fillText(ch,b.sx,b.sy);
    }
  }
  if(reduce){ size(); render(); }
  else{ (function loop(){ang+=0.012; render(); requestAnimationFrame(loop);})(); }

  /* ---------- fit the ascii portrait ---------- */
  function fit(){
    var pre=document.getElementById("avatar"), box=pre.parentElement;
    pre.style.transform="scale(1)";
    var nat=pre.scrollWidth, availW=box.clientWidth-12, availH=box.clientHeight-12;
    var sc=Math.min(availW/nat, availH/pre.scrollHeight); if(!isFinite(sc)||sc<=0)sc=1; if(sc>1)sc=1;
    pre.style.transform="scale("+sc+")";
  }
  fit(); addEventListener("resize",fit);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
  setTimeout(fit,300);
})();
</script>
